
name: Build ClipCraft AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir -p extracted
          unzip -q ClipCraftAI_Android_Starter.zip -d extracted

      - name: Force Java compilation target to 17
        run: |
          cat > force-jvm.gradle <<'EOF'
          import org.gradle.api.tasks.compile.JavaCompile

          gradle.projectsEvaluated {
              allprojects {
                  tasks.withType(JavaCompile).configureEach {
                      sourceCompatibility = '17'
                      targetCompatibility = '17'
                  }
              }
          }
          EOF

      - name: Build APK
        run: |
          PROJECT_DIR=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "No Gradle settings file found"
            exit 1
          fi

          cd "$PROJECT_DIR"
          gradle -I "$GITHUB_WORKSPACE/force-jvm.gradle" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipCraft-AI-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
